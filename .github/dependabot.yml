version: 2
updates:
  # GitHub Actions used by the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Swift Package Manager dependencies. RecoverD has no external dependencies today; this keeps
  # them updated automatically if any are added later (e.g. the planned libfsapfs bridge).
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
